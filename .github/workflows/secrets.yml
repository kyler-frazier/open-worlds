# Secret scan of the whole history, not just the diff: a secret committed and
# then deleted is still in every clone. Runs on every push and PR.
name: secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The CLI image, pinned by digest, rather than gitleaks-action: the action
      # needs a license key for organization repos and adds nothing here.
      # A false positive is allowed in place with a `gitleaks:allow` comment.
      - name: Scan history
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1
