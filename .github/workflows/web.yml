# Lint, types, tests and build for web/.
name: web

# Every push and PR, with no path filter: the job is a required check, and a
# required check that never runs would block every PR that skips it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the build stage of web/Dockerfile.
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci`, not `install`: exactly the lockfile, and a failure if
      # package.json disagrees. The Dockerfile uses the same command.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npx tsc --noEmit

      # Unused files, exports and dependencies.
      - name: Dead code
        run: npm run knip

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build
