# Application edge for the management site: web vs api routing and blocked
# paths. TLS is terminated by an outer proxy, which forwards plain HTTP here
# and sets X-Forwarded-Proto. Game traffic never passes through it.

# Hardening headers, set here so the SPA and API carry them whatever proxy is
# in front, error responses included. No HSTS: that belongs where TLS ends.
#
# The SPA is self-contained: same-origin scripts, styles and API calls, https
# images (Modrinth icons), and no frames but our own Grafana.
map $sent_http_content_type $csp_header {
    default "";
    ~^text/html "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'";
}

# --- Who the client is, and how fast it may go -------------------------------
# The outer proxy (EDGE_TRUSTED_PROXY, substituted at container start) puts
# the client's address in X-Forwarded-For. Taken from it only, so $remote_addr
# is the real client in logs, in what the api sees, and in the limits below.
set_real_ip_from ${EDGE_TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per client address. Sign-in and Drive linking start an OAuth round trip
# each, so a few a minute is plenty; the rest of the api is generous enough
# for the dashboard's polling from a household of tabs.
limit_req_zone $binary_remote_addr zone=api_auth:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:5m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=per_client:5m;
limit_req_status 429;
limit_conn_status 429;

# --- Grafana, admin only -----------------------------------------------------
# Every /grafana/ request is first put to the api (auth_request). Only a 204, a
# current admin session, gets through, and the api names the user. Grafana
# trusts the name only from this edge's address, and the client's own copy of
# the header is overwritten below.
#
# A "yes" is cached per session cookie briefly, so a dashboard load costs one
# check; revocation takes effect within GRAFANA_AUTH_TTL. "No" is never cached.
proxy_cache_path /var/cache/nginx/grafana_auth levels=1 keys_zone=grafana_auth:1m
                 max_size=10m inactive=1m use_temp_path=off;

map $cookie_platform_session $grafana_auth_uncacheable {
    ""      1;
    default 0;
}

# Grafana Live is a websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2g;  # allow world import uploads
    limit_conn per_client 50;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $csp_header always;

    # Infra-only endpoints, consumed over the private Docker network only.
    location /api/internal/ {
        return 404;
    }

    # Prometheus metrics must never be exposed through the public edge.
    location /metrics {
        return 404;
    }

    # Starting an OAuth flow, sign-in or Drive.
    location ~ ^/api/auth/(google|drive)/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # API — preserve host/proto (forwarded by the outer proxy) so secure cookies
    # and OAuth redirects keep working. X-Forwarded-For is replaced, not
    # appended to: the client, already resolved above, is all the api needs.
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;  # stream large import uploads
    }

    # Grafana, behind the api's admin check (above). It serves from this
    # sub-path itself, so the URI passes through unchanged.
    location /grafana/ {
        auth_request /_grafana_auth;
        auth_request_set $grafana_user $upstream_http_x_grafana_user;

        # Resolved per request, so a recreated or stopped grafana does not
        # break the edge.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;

        # Overwrites whatever the client sent; this makes the header
        # trustworthy. Do not move it into a branch.
        proxy_set_header X-WEBAUTH-USER $grafana_user;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;

        # A location-level add_header drops every server-level one, so all are
        # restated. Differences: same-origin framing for the admin page, and no
        # script/style CSP, which would break Grafana.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location = /_grafana_auth {
        internal;
        proxy_pass http://api:8000/api/auth/grafana;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # GRAFANA_AUTH_TTL: how long an admin "yes" is reused. Keyed on the
        # whole session cookie; no cookie, no caching. Only 204 is cached.
        proxy_cache grafana_auth;
        proxy_cache_key $cookie_platform_session;
        proxy_cache_valid 204 1s;
        proxy_no_cache $grafana_auth_uncacheable;
        proxy_cache_bypass $grafana_auth_uncacheable;
        # Starlette refreshes the session cookie on every response, and nginx
        # will not cache a response with Set-Cookie unless told to ignore it.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
    }

    # SPA.
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
