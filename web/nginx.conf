# Serves the built SPA. The edge reverse proxy terminates TLS and forwards
# /api to the API service; this container only serves static assets with a
# history-API fallback so client-side routes resolve to index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Belt and braces: the edge sets the full policy set (including CSP) for
    # everything it proxies, but this container can also be reached directly
    # on the Docker network. Note nginx's add_header is per-block, not
    # inherited past a block that sets its own, so these are repeated below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-cache hashed assets, never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
